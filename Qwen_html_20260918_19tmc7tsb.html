<!-- ============================================================================
     SHALVADZE FOUNDER CRM — READ-ONLY MOBILE PROTOTYPE (index.html)
     Build 1.0.1 — functional fix release (no visual changes)

     FIX NOTES — WHY THE APP WAS STUCK ON THE SPLASH SCREEN
     ---------------------------------------------------------------------------
     1) FATAL BOOT PATH (root cause)
        CRM.init() hydrated the localStorage cache OUTSIDE its try/catch.
        With an empty / legacy / partially-written cache, cached.data was
        undefined -> JSON.parse(JSON.stringify(undefined)) -> SyntaxError.
        init() rejected, `await CRM.init()` threw, and boot() had no
        try/catch/finally, so the splash removal line never executed.
        The splash is pure HTML+CSS, so it stayed on screen forever.

     2) NO FAILSAFE / NO ERROR SURFACE
        Splash removal depended on a successful dashboard render. Any error
        left the overlay mounted. Top-level DOM wiring also ran immediately,
        so a single missing element could kill the whole script.

     3) MOBILE ENGINE COMPATIBILITY (parse-time kill)
        Optional chaining (c.outreach?.paused) is a SyntaxError on
        iOS Safari < 13.4 / older Android WebView, which kills the ENTIRE
        inline script — exactly the reported symptom. All ES2020-only syntax
        removed. Also fixed: `inset:0`, `100dvh` without `100vh` fallback,
        `aspect-ratio` without min-height, unguarded IntersectionObserver.

     4) DATA CORRUPTION BUG
        The demo date-token resolver  /^D([+-]?\d+)$/  also matched the
        cadence enums "D4" / "D10" / "D20", silently rewriting stage names
        into ISO dates and breaking filters, pipeline counts and the cadence
        track. Fixed: date tokens now REQUIRE an explicit sign
        /^D(?:[+-]\d+|0)$/  ("D+4", "D-1"), leaving enums untouched.

     BOOT GUARANTEES (new)
        · #splash-failsafe script registered BEFORE the app bundle: captures
          window.onerror / unhandledrejection and force-removes the splash at
          ~2.8s if the app never reported booted.
        · startApp() has a guaranteed hideSplash() + window.__SV_BOOTED flag.
        · Cache has an in-memory fallback and shape validation.
        · Every page render is wrapped in safePage(); a broken screen shows
          an inline error card instead of freezing the shell.

     ARCHITECTURE (unchanged)
        /data/crm.json (inlined below) -> LocalJsonSource | RemoteApiSource
        -> SheetsAdapter (Apps Script payload -> schema) -> CRM data service
        -> Rules (cadence + suppression) -> Router -> Pages -> Components.
        The UI never touches localStorage or fetch directly.
     ============================================================================ -->
